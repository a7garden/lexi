name: Lexi
options:
  bundleIdPrefix: kr.garden.lexi
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  LexiCore:
    path: Packages/LexiCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  Lexi:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: LexiCore
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lexi
        CFBundleName: Lexi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.reference
        NSHumanReadableCopyright: ""
        NSServices:
          - NSMenuItem:
              default: Lexi에서 찾아보기
            NSMessage: lookupSelectedText
            NSSendTypes:
              - public.utf8-plain-text
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: kr.garden.lexi.app
        PRODUCT_NAME: Lexi
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: W5SAS95CBV
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
