name: Lexi
options:
  bundleIdPrefix: kr.garden.lexi
  createIntermediateGroups: true
  developmentLanguage: ko
  deploymentTarget:
    macOS: "14.0"

packages:
  LexiCore:
    path: Packages/LexiCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  Lexi:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: LexiCore
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lexi
        CFBundleName: Lexi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.reference
        NSHumanReadableCopyright: ""
        NSServices:
          - NSMenuItem:
              default: Lexi에게 물어보기
            NSMessage: lookupSelectedText
            NSPortName: Lexi
            NSRequiredContext: {}
            NSServiceDescription: 선택한 텍스트를 Lexi로 조회하고, 없는 개념은 조사해 저장합니다.
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: kr.garden.lexi.app
        PRODUCT_NAME: Lexi
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: W5SAS95CBV
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Developer ID Application
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_ENTITLEMENTS: App/Lexi.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "Lexi Developer ID Main"

  LexiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LexiAppTests
    dependencies:
      - target: Lexi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.garden.lexi.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lexi.app/Contents/MacOS/Lexi
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Developer ID Application
        DEVELOPMENT_TEAM: W5SAS95CBV

schemes:
  Lexi:
    build:
      targets:
        Lexi: all
    test:
      targets:
        - LexiTests
